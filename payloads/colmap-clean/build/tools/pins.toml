# An excerpt of scAnt_API's tools/pins.toml at main f7853f13: the [tools.colmap-clean] tables that
# tools/build_colmap.py reads (the sources' commits, the toolset, the layout, the ONNX models), copied unchanged with
# scAnt_API's comments. The archive's own address and digest are pinned in scAnt_API, not here.

[tools.colmap-clean]
# TEMPORARY (docs/phases/p5b.md, E7, stage 1): COLMAP 4.1.1 built by the repository without its GPL, AGPL and
# non-commercial parts, beside [tools.colmap], which the product's steps still use; stage 5 switches the product's pin
# to this build and deletes this mark. Built, not fetched: tools/build_colmap.py (its docstring says how) from COLMAP's
# tag 4.1.1 at colmap_commit with tools/colmap_patches (SIFT_GPU_ENABLED=OFF: no SiftGPU, CUDA stays for PatchMatch;
# SIFT with use_gpu fails its option check), vcpkg at vcpkg_commit (COLMAP 4.1.1's own baseline) with the overlay port
# tools/colmap_ports/ceres (Ceres 2.2.0 on CHOLMOD's LGPL modules, no SuiteSparseQR), MSVC msvc and CUDA cuda. No GUI
# (no Qt, no OpenGL), no CGAL, no LSD, no downloads at run time; ONNX Runtime (MIT) for ALIKED and LightGlue, on the
# processor (its CUDA provider, which needs cuDNN, is not shipped). Licences: BSD-3-Clause, its libraries in
# env/README.md ("colmap-clean's libraries"; LGPL-2.1-or-later CHOLMOD and LGPL-3.0 none else: shared, unmodified),
# no GPL, AGPL or non-commercial part; licence-proof.json of the build lists the import tables that show it.
# The bytes are not reproducible (no /Brepro): manifest_sha256 (its manifest.json: every file's sha256) and
# executable_sha256 name the build of record, which the build prints the lines for.
version = "4.1.1"
build = "tools/build_colmap.py"
colmap_commit = "a0d785fba74b2664f31edc4a29026a8b27c00f67"
vcpkg_commit = "a0b1c8d3a477c1cb4813d8e127a56961707ca42b"
msvc = "14.44.35207"
cuda = "12.8"
# Turing to Blackwell (the scAnt-payloads gate: compute capability 7.5 or higher), with Blackwell's PTX for later cards.
cuda_architectures = "75-real;80-real;86-real;89-real;90-real;120-real;120-virtual"
install_dir = "colmap-clean"
executable = "bin/colmap.exe"
reports_version = "4.1.1"
# The build of record (2026-10-17, P5b E7 stage 1: vcpkg 17 min, COLMAP 11 min on this PC; 155 MB, 38 files in bin/).
manifest_sha256 = "b7906d8d3f55357d5e504fcbed077252323aa0251784cc92ae55c1c9f6c64909"
executable_sha256 = "7d731548bcf20e679f1f3287c25a433c907bc9b21f453405202b7a8246094f4d"

# The ONNX models COLMAP 4.1.1 names by default (src/colmap/feature/resources.h: its 3.13.0 release's files and their
# sha256), fetched by the build into models/ (DOWNLOAD_ENABLED is off: a run gives the paths). Their licences are the
# weights' upstream ones (ALIKED BSD-3-Clause, LightGlue's ALIKED weights Apache-2.0; COLMAP's export repositories
# colmap/ALIKED-ONNX BSD-3-Clause and colmap/LightGlue-ONNX Apache-2.0), each text pinned at a commit. Not SuperPoint.
[tools.colmap-clean.weights.aliked-n16rot]
file = "aliked-n16rot.onnx"
